name: CI

# Introduced in R2.5 as the smallest CI that protects the known-good
# baseline; extended in R3 with the frontend unit/component test suite
# (Vitest + React Testing Library), and in R3.5 with a real-browser
# Playwright E2E job (Chromium) -- see docs/testing/BROWSER_E2E_STRATEGY.md
# for why all three levels are needed; the R3 native-image-drag bug is the
# concrete example unit/component tests could not catch. No deployment, no
# Docker image publishing, no lint/type gate yet -- those are separate,
# later decisions (see
# docs/architecture/PRODUCTION_ROADMAP.md's Production-Engineering section).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest

    # Local dev uses host port 5433 to avoid a conflict with an unrelated
    # project's Postgres on this developer's machine (see
    # backend/app/core/config.py). That constraint doesn't exist on a clean
    # CI runner, so the service container uses Postgres's standard 5432.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: massiq
          POSTGRES_PASSWORD: massiq
          POSTGRES_DB: massiq
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U massiq -d massiq"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # backend/requirements.txt is the authoritative dependency file for
      # this application (see docs/releases/R2_5_FOUNDATION_HARDENING_CHECKLIST.md's
      # "Dependency file decision") -- requirements-minimal.txt is not
      # installed or exercised by CI, deliberately, pending its own cleanup.
      DATABASE_URL: postgresql+psycopg2://massiq:massiq@127.0.0.1:5432/massiq

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Apply Alembic migrations
        working-directory: backend
        run: python -m alembic upgrade head

      - name: Run backend test suite
        working-directory: backend
        run: python -m unittest discover -s tests -p "test_*.py"

  frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend test suite
        working-directory: frontend
        run: npm test

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  e2e:
    needs: [backend, frontend]
    runs-on: ubuntu-latest

    # A separate, isolated Postgres service container -- e2e_server.py
    # drops and recreates its own `massiq_e2e` database inside it on every
    # run (see backend/scripts/e2e_server.py), so this never touches
    # anything the `backend` job's own container does (separate jobs get
    # separate containers/VMs entirely) and never depends on the dev-only
    # 5433 port convention.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: massiq
          POSTGRES_PASSWORD: massiq
          POSTGRES_DB: massiq
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U massiq -d massiq"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # e2e_server.py derives its actual DATABASE_URL by swapping this
      # value's database name for "massiq_e2e" -- see its own docstring.
      DATABASE_URL: postgresql+psycopg2://massiq:massiq@127.0.0.1:5432/massiq

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright Chromium (with OS dependencies)
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      # Deliberately no separate "migrate DB" step here: Playwright's
      # webServer config (frontend/playwright.config.js) launches
      # e2e/scripts/start-backend.js, which runs backend/scripts/e2e_server.py
      # -- it creates+migrates the isolated massiq_e2e database itself as
      # part of starting up, exactly the same way it does for a local
      # `npm run test:e2e`. A separate CI-level migration step would just
      # be redone (harmlessly, but redundantly) the moment the E2E run starts.
      - name: Run Playwright E2E suite (Chromium)
        working-directory: frontend
        run: npm run test:e2e

      - name: Upload Playwright report and traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 14
