name: CI

# R2.5 hardening: the smallest CI that protects the known-good baseline
# (114 pre-existing tests + R2.5's new hardening tests, plus the frontend
# build). No deployment, no Docker image publishing, no lint/type gate yet
# -- those are separate, later decisions (see
# docs/architecture/PRODUCTION_ROADMAP.md's Production-Engineering section).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest

    # Local dev uses host port 5433 to avoid a conflict with an unrelated
    # project's Postgres on this developer's machine (see
    # backend/app/core/config.py). That constraint doesn't exist on a clean
    # CI runner, so the service container uses Postgres's standard 5432.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: massiq
          POSTGRES_PASSWORD: massiq
          POSTGRES_DB: massiq
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U massiq -d massiq"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # backend/requirements.txt is the authoritative dependency file for
      # this application (see docs/releases/R2_5_FOUNDATION_HARDENING_CHECKLIST.md's
      # "Dependency file decision") -- requirements-minimal.txt is not
      # installed or exercised by CI, deliberately, pending its own cleanup.
      DATABASE_URL: postgresql+psycopg2://massiq:massiq@127.0.0.1:5432/massiq

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Apply Alembic migrations
        working-directory: backend
        run: python -m alembic upgrade head

      - name: Run backend test suite
        working-directory: backend
        run: python -m unittest discover -s tests -p "test_*.py"

  frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build
